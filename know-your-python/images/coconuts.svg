<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#ffd43b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- left half: rounded left, hollow opening facing right -->
  <path d="M86 68 A30 30 0 0 0 86 128"/>
  <ellipse cx="86" cy="98" rx="9" ry="30"/>
  <ellipse cx="86" cy="98" rx="4.5" ry="20" stroke-width="4"/>
  <!-- right half: rounded right, hollow opening facing left -->
  <path d="M114 68 A30 30 0 0 1 114 128"/>
  <ellipse cx="114" cy="98" rx="9" ry="30"/>
  <ellipse cx="114" cy="98" rx="4.5" ry="20" stroke-width="4"/>
  <!-- subtle impact lines (top and bottom) -->
  <path d="M100 60 v-7 M92 62 l-4 -5 M108 62 l4 -5" stroke-width="3"/>
  <path d="M100 136 v7 M92 134 l-4 5 M108 134 l4 5" stroke-width="3"/>
</svg>
