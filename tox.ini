# content of: tox.ini
[tox]
envlist = flake8,py{313,312,311,310}

[testenv]
passenv = *
deps =
    -r requirements-dev.in
commands =
    # No unit tests yet: smoke-import the extension so packaging/imports are checked.
    {env:COMMAND:python} -c "import sphinx_quiz; print(sphinx_quiz.__version__)"

[testenv:flake8]
deps = flake8
commands = flake8 sphinx_quiz

[flake8]
max-line-length = 120
extend-ignore = E203,W503
exclude = .git,.tox,.venv,build,dist,*.egg-info
