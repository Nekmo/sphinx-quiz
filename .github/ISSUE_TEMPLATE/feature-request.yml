name: Feature Request
description: Suggest a new feature or improvement for the extension.
labels: ["enhancement"]
body:

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that is hard or impossible today?
      placeholder: |
        "I would like to... but currently..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how it would work. Keep the scope as narrow as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you have thought about.
